<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00B4A6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background transparent -->
  <rect width="100" height="100" fill="transparent" />
  
  <!-- Outer glowing circle ring -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#grad1)" stroke-width="8" opacity="0.9" />

  <!-- Medical Cross / Plus mixed with a wave -->
  <!-- Vertical part of the plus -->
  <rect x="42" y="25" width="16" height="50" rx="4" fill="url(#grad1)" />
  <!-- Horizontal part of the plus -->
  <rect x="25" y="42" width="50" height="16" rx="4" fill="url(#grad1)" />
  
  <!-- A dynamic swoosh to represent "Flow" overlaying the cross -->
  <path d="M 15 65 Q 40 85 60 50 T 85 30" fill="none" stroke="#00d2ff" stroke-width="6" stroke-linecap="round" />
</svg>
